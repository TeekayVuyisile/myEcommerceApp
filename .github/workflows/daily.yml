name: Daily maintenance

on:
  schedule:
    # 06:00 UTC = 08:00 SAST, every day
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Keep Supabase project awake
        run: |
          curl -sf -X GET "${{ secrets.SITE_URL }}/api/cron/keep-alive" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"

      - name: Send instalment reminder email if any are due
        run: |
          curl -sf -X GET "${{ secrets.SITE_URL }}/api/cron/reminders" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
